spring:
  application:
    name: ifs25058-p5-pbo2026-springboot-cashflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:pbo2026_cashflow}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: true

server:
  port: ${APP_PORT:${PORT:8080}}
  # Kompres respons teks (HTML/JS/CSS/JSON) agar halaman dimuat lebih cepat
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,application/manifest+json,image/svg+xml
  servlet:
    session:
      timeout: 8h
      cookie:
        name: CASHFLOWSESSION
        http-only: true

app:
  root-username: ${ROOT_USERNAME:admin}
  root-password: ${ROOT_PASSWORD:admin123}
  upload-dir: ${UPLOAD_DIR:uploads}

vaadin:
  launch-browser: false
  liveReload:
    enabled: true
